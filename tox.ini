[tox]
minversion = 3.14.0
envlist = py314, py315, flake8
isolated_build = true

[gh-actions]
python =
    3.14: py314, flake8
    3.15: py315, flake8

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
deps =
    -r{toxinidir}/requirements_dev.txt
commands =
    pytest --basetemp={envtmpdir}

[testenv:flake8]
basepython = python3.14
deps = flake8
commands = flake8 adventofcode